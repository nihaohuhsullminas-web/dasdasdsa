<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>Досье DSP9AI</title><link rel="stylesheet" href="dossier-style.css"></head><body><header><a class="brand" href="index.html" style="text-decoration:none">DSP<span>9</span>AI <small style="color:#999;font-weight:400">/ ARCHIVE</small></a><nav><a href="index.html">Главная</a><a href="index.html#objects">Объекты</a><a href="index.html#incidents">Инциденты</a><a href="index.html#anomalies">Аномалии</a></nav></header><main><div class="detail-head"><a class="button" href="index.html#objects">← НАЗАД К КАРТОЧКАМ</a><div id="kicker" class="kicker" style="margin-top:24px">DSP9 / CLASSIFIED</div><h1 id="title">Загрузка досье…</h1><div class="meta" id="meta"></div></div><div class="dossier-layout"><aside class="gallery"><img id="poster" src="" alt="Оригинальная фотография досье"><div class="caption" id="caption">ОРИГИНАЛЬНЫЙ МАТЕРИАЛ АРХИВА</div><p id="sourceLink"></p></aside><article class="dossier-text" id="text"></article></div><footer class="footer"><span>DSP9AI · RESTRICTED ACCESS</span><a href="index.html#objects">Вернуться в реестр</a></footer></main><script src="data.js"></script><script>
const id=new URLSearchParams(location.search).get('id'),o=DSP9_OBJECTS.find(x=>x.id===id);
if(!o){document.getElementById('title').textContent='ДОСЬЕ НЕ НАЙДЕНО';document.getElementById('text').textContent='Объект отсутствует в текущем реестре.'}
else{document.title='DSP9AI — '+o.name;document.getElementById('kicker').textContent='DSP9 / OBJECT '+o.id+' / CLASSIFIED';document.getElementById('title').textContent=o.name+' — '+o.subtitle;document.getElementById('meta').innerHTML='<span>ОБЪЕКТ '+o.id+'</span><span>СТАТУС: '+o.status+'</span><span>ДОПУСК: '+o.access+'</span>';document.getElementById('poster').src='assets/'+o.img;document.getElementById('poster').alt='Оригинал: '+o.name;document.getElementById('text').textContent=o.body;

if(o.img.endsWith('.docx')){document.getElementById('poster').style.display='none';document.getElementById('caption').textContent='Оригинальный документ DOCX';document.getElementById('sourceLink').innerHTML='<a class="button" href="assets/'+o.img+'" download>СКАЧАТЬ ОРИГИНАЛ DOCX</a>'}
}
</script></body></html>
